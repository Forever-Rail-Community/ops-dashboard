name: Bug
description: Something in the Operations Center isn't working as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Go to Railroader > Map
        2. Zoom in on Bryson
        3. …
  - type: dropdown
    id: game
    attributes:
      label: Game
      options: [Railroader, Run8, Both, Not about a game]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows, Safari on iPhone…
