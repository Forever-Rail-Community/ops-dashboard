# Labels each pull request by the type in its title (feat: -> feature, fix: -> bug, ...), so the release notes put
# it under the right heading (see .github/release.yml). Changing the title changes the label.
name: Pull request labels

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const TYPES = { feat: 'feature', fix: 'bug', perf: 'performance', refactor: 'chore', chore: 'chore', docs: 'documentation' }
            const pr = context.payload.pull_request
            const want = TYPES[/^(\w+)(\([^)]*\))?!?:/.exec(pr.title)?.[1]]
            const has = pr.labels.map((l) => l.name)
            const issue = { ...context.repo, issue_number: pr.number }
            for (const label of new Set(Object.values(TYPES))) {
              if (label !== want && has.includes(label)) await github.rest.issues.removeLabel({ ...issue, name: label })
            }
            if (want && !has.includes(want)) await github.rest.issues.addLabels({ ...issue, labels: [want] })
