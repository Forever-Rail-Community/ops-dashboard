# Keeps a release pull request open with everything merged since the last release. Merging it bumps the version
# in package.json, updates CHANGELOG.md, and tags and publishes the GitHub release. See CONTRIBUTING.md.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
