# Pull requests are squash-merged, so the title becomes the commit Release Please reads. This checks it starts
# with a type such as feat: or fix:.
name: Pull request title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            chore
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: 'Start the description with a capital letter, for example "feat: Show the join code to members".'
